<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Souvenir Coin Kiosk — Fleet Admin</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<style>
  :root{--bg:#0a1628;--panel:#11203f;--panel2:#0f1c38;--gold:#c9a227;--gold-l:#e8c04a;--white:#f5f5f5;--dim:#9fb0c8;--green:#4caf50;--red:#e53935;--amber:#e0a020;--line:rgba(255,255,255,.08)}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--white);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif}
  a{color:inherit;text-decoration:none}
  .topbar{display:flex;align-items:center;justify-content:space-between;padding:16px 28px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:5}
  .brand{font-size:1.15rem;font-weight:800;color:var(--gold-l)}
  .brand small{color:var(--dim);font-weight:500;font-size:.8rem;margin-left:8px}
  .wrap{max-width:1200px;margin:0 auto;padding:24px 28px}
  .crumbs{color:var(--dim);font-size:.85rem;margin-bottom:18px}
  .crumbs a{color:var(--gold-l);cursor:pointer}
  .grid{display:grid;gap:16px}
  .cards{grid-template-columns:repeat(auto-fill,minmax(330px,1fr))}
  .metrics{grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px 20px}
  .kcard{cursor:pointer;transition:border-color .15s,transform .15s}
  .kcard:hover{border-color:rgba(201,162,39,.6);transform:translateY(-2px)}
  .khead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:10px}
  .kname{font-weight:700;font-size:1.05rem}
  .kloc{color:var(--dim);font-size:.82rem;margin-top:2px}
  .pill{font-size:.72rem;font-weight:700;padding:3px 10px;border-radius:999px;white-space:nowrap}
  .on{background:rgba(76,175,80,.15);color:var(--green)}
  .off{background:rgba(229,57,53,.15);color:var(--red)}
  .st-active{color:var(--green)} .st-maintenance{color:var(--amber)} .st-out_of_service{color:var(--red)}
  .kmetrics{display:flex;gap:18px;margin-top:14px;flex-wrap:wrap}
  .kmetrics div{font-size:.8rem;color:var(--dim)}
  .kmetrics b{display:block;color:var(--white);font-size:1.2rem;font-weight:700;margin-top:2px}
  .label{color:var(--dim);font-size:.8rem;margin-bottom:6px}
  .val{font-size:1.5rem;font-weight:700}
  .tabs{display:flex;flex-wrap:wrap;gap:4px;border-bottom:1px solid var(--line);margin:18px 0 20px}
  .tab{padding:9px 18px;background:none;border:none;border-bottom:2px solid transparent;color:var(--dim);cursor:pointer;font-size:.92rem}
  .tab.active{color:var(--gold-l);border-bottom-color:var(--gold);font-weight:700}
  table{width:100%;border-collapse:collapse;font-size:.84rem}
  th{text-align:left;color:var(--gold-l);padding:9px 11px;border-bottom:1px solid rgba(201,162,39,.3)}
  td{padding:9px 11px;border-bottom:1px solid rgba(255,255,255,.05)}
  .dim{color:var(--dim)} .mono{font-family:monospace;font-size:.78rem} .ok{color:var(--green)} .err{color:var(--red)}
  .badge{background:var(--red);color:#fff;border-radius:999px;padding:1px 8px;font-size:.7rem;font-weight:700;margin-left:6px}
  button.btn{background:linear-gradient(135deg,var(--gold),#a07d15);border:none;color:#fff;padding:10px 22px;border-radius:10px;cursor:pointer;font-weight:700}
  button.ghost{background:none;border:1px solid rgba(201,162,39,.4);color:var(--gold-l);padding:8px 16px;border-radius:10px;cursor:pointer}
  input,select{background:rgba(255,255,255,.06);border:1px solid rgba(201,162,39,.4);border-radius:9px;color:var(--white);padding:9px 12px;font-size:.95rem}
  .pills{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap}
  .pchip{padding:7px 16px;border-radius:9px;border:1px solid var(--line);background:none;color:var(--dim);cursor:pointer}
  .pchip.active{border-color:var(--gold);background:rgba(201,162,39,.15);color:var(--gold-l)}
  .login{max-width:360px;margin:90px auto;text-align:center}
  .login input{width:100%;margin:14px 0}
  .hide{display:none}
  .row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .between{justify-content:space-between}
  .hopbar{height:8px;border-radius:6px;background:rgba(255,255,255,.1);overflow:hidden;margin-top:6px}
  .hopbar>div{height:100%;background:linear-gradient(90deg,var(--gold),var(--gold-l))}
  .muted{color:var(--dim);font-size:.85rem}
  .empty{padding:30px;text-align:center;color:var(--dim)}
</style>
</head>
<body>
<div id="login" class="login">
  <div class="brand" style="font-size:1.5rem">Fleet Admin</div>
  <p class="muted" style="margin:6px 0 4px">Souvenir Coin Kiosk — Central Dashboard</p>
  <input type="text" id="user" placeholder="Username" autocomplete="username" onkeydown="if(event.key==='Enter')document.getElementById('pw').focus()"/>
  <input type="password" id="pw" placeholder="Password" autocomplete="current-password" onkeydown="if(event.key==='Enter')login()"/>
  <div id="lerr" class="err" style="min-height:20px"></div>
  <button class="btn" style="width:100%" onclick="login()">Sign In</button>
</div>

<div id="app" class="hide">
  <div class="topbar">
    <div class="brand">Souvenir Coin Kiosk <small>Fleet Admin</small></div>
    <div class="row">
      <span id="whoami" class="muted"></span>
      <span id="liveDot" class="pill on">● live</span>
      <button class="ghost" onclick="logout()">Sign out</button>
    </div>
  </div>
  <div class="wrap" id="view"></div>
</div>

<script>
let token=null, view={name:'fleet'}, timer=null, me=null;
const admin=()=>me&&me.role==='admin';

async function api(p,opts={}){
  const r=await fetch(p,{...opts,headers:{'Content-Type':'application/json','Authorization':'Bearer '+token,...(opts.headers||{})}});
  if(r.status===401){token=null;showLogin();throw new Error('unauth')}
  return r.json();
}
const rand=c=>'R'+((c||0)/100).toFixed(2);
const esc=s=>String(s==null?'':s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const ago=ts=>{if(!ts)return'never';const s=Math.floor((Date.now()-new Date(ts).getTime())/1000);if(s<60)return s+'s ago';if(s<3600)return Math.floor(s/60)+'m ago';if(s<86400)return Math.floor(s/3600)+'h ago';return Math.floor(s/86400)+'d ago'};
const stLabel=s=>({active:'Active',maintenance:'Maintenance',out_of_service:'Out of Service'}[s]||s);

function showLogin(){document.getElementById('login').classList.remove('hide');document.getElementById('app').classList.add('hide');if(timer)clearInterval(timer)}
function showApp(){document.getElementById('login').classList.add('hide');document.getElementById('app').classList.remove('hide')}
async function login(){
  const username=document.getElementById('user').value;
  const pw=document.getElementById('pw').value;
  const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username,password:pw})});
  const d=await r.json();
  if(d.token){token=d.token;me={username:d.username,role:d.role};document.getElementById('whoami').textContent=d.username+' · '+d.role;showApp();go({name:'fleet'});timer=setInterval(refresh,8000)}
  else document.getElementById('lerr').textContent=d.error||'Login failed';
}
function logout(){token=null;showLogin()}

function go(v){view=v;render()}
function refresh(){
  if(!token) return;
  // Don't auto-rebuild while the user is editing a field (it would wipe input).
  const ae=document.activeElement;
  if(ae && /^(INPUT|SELECT|TEXTAREA)$/.test(ae.tagName)) return;
  // Skip views with charts, file pickers, or editing forms to avoid flicker /
  // losing a selected file or half-filled form (these config screens don't need
  // an 8-second live refresh).
  if(view.name==='global' || view.name==='images' || view.name==='users' || view.name==='operators' || view.name==='destinations' || view.name==='pricing' || view.name==='updates' || (view.name==='kiosk' && ['sales','transactions','marketing','inventory'].includes(kioskTab))) return;
  // Preserve the scroll position across the rebuild so an auto-refresh doesn't
  // jump the page back to the top while the user is reading further down.
  const y=window.scrollY;
  // Restore after the full view (incl. async sub-content) is in place and laid out.
  Promise.resolve(render(true)).then(()=>{
    requestAnimationFrame(()=>{ if(Math.abs(window.scrollY-y)>2) window.scrollTo(0,y); });
  });
}

async function render(isAuto){
  const el=document.getElementById('view');
  if(view.name==='fleet') return renderFleet(el,isAuto);
  if(view.name==='kiosk') return renderKiosk(el,view.id,isAuto);
  if(view.name==='global') return renderGlobal(el,isAuto);
  if(view.name==='pricing') return renderPricing(el,isAuto);
  if(view.name==='users') return renderUsers(el);
  if(view.name==='operators') return renderOperators(el);
  if(view.name==='images') return renderImages(el);
  if(view.name==='monitoring') return renderMonitoring(el);
  if(view.name==='destinations') return renderDestinations(el);
  if(view.name==='updates') return renderUpdates(el);
  if(view.name==='audit') return renderAudit(el);
}

/* ---------- AUDIT LOG + BACKUP (admin only) ---------- */
function auditLabel(e){
  const p=e.path.replace('/api/','');
  const map={POST:'created',PATCH:'updated',DELETE:'deleted',PUT:'updated'};
  return (map[e.method]||e.method)+' '+p;
}
async function renderAudit(el){
  if(!admin()){el.innerHTML='<div class="empty">Admin role required.</div>';return}
  const rows=await api('/api/audit?limit=300');
  el.innerHTML=`
    <div class="crumbs"><a onclick="go({name:'fleet'})">← Fleet</a> / Audit & Backup</div>
    <div class="row between">
      <h2 style="font-size:1.4rem">Audit log</h2>
      <a class="ghost" style="text-decoration:none;padding:8px 16px" href="/api/backup" onclick="downloadBackup(event)">⤓ Download backup</a>
    </div>
    <p class="muted" style="margin:6px 0 16px">Every admin change is recorded here. The backup downloads the full fleet dataset (kiosks, settings, transactions, users) as a JSON file.</p>
    <div class="card"><table>
      <thead><tr><th>When</th><th>User</th><th>Role</th><th>Action</th></tr></thead>
      <tbody>${rows.length?rows.map(e=>`<tr>
        <td class="dim">${esc(e.at.replace('T',' ').substring(0,19))}</td>
        <td>${esc(e.user)}</td>
        <td class="dim">${esc(e.role)}</td>
        <td class="mono">${esc(auditLabel(e))}</td>
      </tr>`).join(''):'<tr><td colspan=4 class="empty">No activity recorded yet.</td></tr>'}
      </tbody></table></div>`;
}
async function downloadBackup(ev){
  ev.preventDefault();
  const r=await fetch('/api/backup',{headers:{'Authorization':'Bearer '+token}});
  if(!r.ok){alert('Backup failed');return}
  const blob=await r.blob();
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  const stamp=new Date().toISOString().replace(/[:.]/g,'-').substring(0,19);
  a.download='fleet-backup-'+stamp+'.json';
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),2000);
}

/* ---------- DESTINATIONS (admin only) ---------- */
async function renderDestinations(el){
  if(!admin()){el.innerHTML='<div class="empty">Admin role required.</div>';return}
  const [dests,kiosks]=await Promise.all([api('/api/destinations'),api('/api/kiosks')]);
  const kiosksOf=name=>kiosks.filter(k=>k.destination===name).map(k=>k.name);
  el.innerHTML=`
    <div class="crumbs"><a onclick="go({name:'fleet'})">← Fleet</a> / Destinations</div>
    <h2 style="font-size:1.4rem;margin-bottom:6px">Destinations</h2>
    <p class="muted" style="margin-bottom:6px">A destination is a <b>location group</b> (e.g. Cape Town) that kiosks belong to. It's used to organise the fleet and power "Revenue by Location" in reports.</p>
    <p class="muted" style="margin-bottom:18px">This page manages the <b>list</b> of destinations. To put a kiosk in one, open the kiosk → <b>Overview</b> → <b>Destination</b> dropdown → Save.</p>
    <div class="card" style="max-width:520px;margin-bottom:20px">
      <div class="label">Add destination</div>
      <div class="row" style="margin-top:10px"><input id="nd_name" placeholder="Name (e.g. Garden Route)" style="flex:1"/><button class="btn" onclick="addDest()">Add</button><span id="nd_msg" class="ok"></span></div>
    </div>
    <div class="card"><table>
      <thead><tr><th>Name</th><th>ID</th><th>Assigned kiosks</th><th>Actions</th></tr></thead>
      <tbody>${dests.map(d=>{const ks=kiosksOf(d.name);return `<tr>
        <td><input value="${esc(d.name)}" id="dn_${d.id}" style="width:180px"/></td>
        <td class="mono">${esc(d.id)}</td>
        <td>${ks.length?ks.map(n=>esc(n)).join(', '):'<span class="muted">none yet</span>'}</td>
        <td><div class="row">
          <button class="ghost" onclick="renameDest('${d.id}')">Save</button>
          <button class="ghost" style="border-color:var(--red);color:var(--red)" onclick="delDest('${d.id}',${d.kioskCount})">Delete</button>
          <span id="dm_${d.id}" class="ok"></span>
        </div></td>
      </tr>`}).join('')}</tbody>
    </table></div>`;
}
async function addDest(){
  const name=document.getElementById('nd_name').value.trim();
  if(!name){document.getElementById('nd_msg').textContent='Enter a name';return}
  const r=await api('/api/destinations',{method:'POST',body:JSON.stringify({name})});
  document.getElementById('nd_msg').textContent=r.error||'Added';if(!r.error)render();
}
async function renameDest(id){
  const name=document.getElementById('dn_'+id).value.trim();
  await api('/api/destinations/'+encodeURIComponent(id),{method:'PATCH',body:JSON.stringify({name})});
  document.getElementById('dm_'+id).textContent='Saved';setTimeout(()=>{const e=document.getElementById('dm_'+id);if(e)e.textContent=''},1500);
}
async function delDest(id,count){
  if(count>0){alert('This destination is used by '+count+' kiosk(s). Reassign them first.');return}
  if(!confirm('Delete destination '+id+'?'))return;
  const r=await api('/api/destinations/'+encodeURIComponent(id),{method:'DELETE'});
  if(r.error)alert(r.error);render();
}

/* ---------- MONITORING (alerts + settings) ---------- */
async function renderMonitoring(el){
  const [alerts,settings]=await Promise.all([api('/api/system-alerts'),api('/api/settings')]);
  const typeLabel=t=>t==='offline'?'Offline':t.startsWith('low_coin')?'Low coin':t;
  el.innerHTML=`
    <div class="crumbs"><a onclick="go({name:'fleet'})">← Fleet</a> / Monitoring</div>
    <h2 style="font-size:1.4rem;margin-bottom:6px">Monitoring & Alerts</h2>
    <p class="muted" style="margin-bottom:18px">The fleet is checked every minute. Alerts open automatically and clear themselves when the condition is resolved (kiosk back online, hopper refilled).</p>
    <div class="card" style="margin-bottom:20px">
      <div class="label">Active alerts (${alerts.length})</div>
      ${alerts.length?`<table style="margin-top:8px"><thead><tr><th>When</th><th>Kiosk</th><th>Type</th><th>Detail</th><th></th></tr></thead><tbody>
        ${alerts.map(a=>`<tr>
          <td class="dim">${esc((a.createdAt||'').substring(0,19))}</td>
          <td>${esc(a.kioskName)}</td>
          <td><span class="pill" style="background:${a.type==='offline'?'rgba(229,57,53,.15)':'rgba(224,160,32,.15)'};color:${a.type==='offline'?'var(--red)':'var(--amber)'}">${typeLabel(a.type)}</span></td>
          <td>${esc(a.message)}</td>
          <td>${admin()?`<button class="ghost" onclick="ackAlert(${a.id})">Acknowledge</button>`:'<span class="muted">—</span>'}</td>
        </tr>`).join('')}
      </tbody></table>`:'<div style="padding:24px 0;color:var(--green)">✓ All clear — no active alerts.</div>'}
    </div>
    ${admin()?`<div class="card" style="max-width:560px">
      <div class="label">Alert settings</div>
      <div class="row" style="margin-top:12px"><label class="muted" style="width:170px">Low-coin threshold</label>
        <input type="number" id="set_low" min="0" step="1" value="${settings.lowCoinThreshold}" style="width:110px"/><span class="muted">coins</span></div>
      <div class="row" style="margin-top:10px"><label class="muted" style="width:170px">Offline after</label>
        <input type="number" id="set_off" min="1" step="1" value="${settings.offlineMinutes}" style="width:110px"/><span class="muted">minutes</span></div>
      <div class="row" style="margin-top:10px"><label class="muted" style="width:170px">Webhook URL</label>
        <input type="text" id="set_hook" placeholder="https://hooks.slack.com/… (optional)" value="${esc(settings.webhookUrl||'')}" style="flex:1"/></div>
      <p class="muted" style="font-size:.8rem;margin-top:8px">Webhook receives a JSON POST <code>{text, alert}</code> on each new alert — works with Slack/Teams/Telegram-style incoming webhooks or any HTTP endpoint.</p>
      <div style="margin-top:12px"><button class="btn" onclick="saveSettings()">Save settings</button><span id="setmsg" class="ok"></span></div>
    </div>`:''}`;
}
async function ackAlert(id){await api('/api/system-alerts/ack',{method:'POST',body:JSON.stringify({id})});render()}
async function saveSettings(){
  const body=JSON.stringify({
    lowCoinThreshold:parseInt(document.getElementById('set_low').value)||0,
    offlineMinutes:parseInt(document.getElementById('set_off').value)||5,
    webhookUrl:document.getElementById('set_hook').value
  });
  await api('/api/settings',{method:'PUT',body});
  document.getElementById('setmsg').textContent='Saved';
  setTimeout(()=>{document.getElementById('setmsg').textContent=''},1500);
}

/* ---------- COIN IMAGES (admin only) — per kiosk ---------- */
let _imgKiosk=null;          // currently selected kiosk id
let _preview={1:null,2:null}; // pending upload preview per slot
async function renderImages(el){
  if(!admin()){el.innerHTML='<div class="empty">Admin role required.</div>';return}
  const kiosks=await api('/api/kiosks');
  if(!_imgKiosk || !kiosks.find(k=>k.id===_imgKiosk)) _imgKiosk=kiosks[0]?.id||null;
  const k=kiosks.find(x=>x.id===_imgKiosk);
  const versions=_imgKiosk?await api('/api/images?kioskId='+encodeURIComponent(_imgKiosk)):[];
  const slotBlock=(s)=>{
    const current=k && k.coinImages && k.coinImages[s];
    const hist=versions.filter(i=>i.slot===s);
    return `<div class="card" style="margin-bottom:18px">
      <div class="row between"><div class="label">Coin ${s}</div>
        <div>${current?`<img src="${current.url}" style="width:54px;height:54px;border-radius:50%;object-fit:contain;background:rgba(255,255,255,.05)"/>`:'<span class="muted">showing bundled default</span>'}</div></div>
      <div class="row" style="margin:12px 0">
        <input type="file" accept="image/png,image/jpeg" onchange="previewImg(${s},this)"/>
        ${_preview[s]?`<img src="${_preview[s].url}" style="width:60px;height:60px;border-radius:50%;object-fit:contain;background:rgba(255,255,255,.05)"/>`:''}
        <button class="btn" onclick="uploadImg(${s})">Upload &amp; apply</button>
        <span id="uimsg${s}" class="ok"></span>
      </div>
      ${hist.length?`<div class="label" style="margin-top:6px">Version history — click to revert</div>
      <div class="row" style="flex-wrap:wrap;gap:10px;margin-top:8px">
        ${hist.map(i=>`<div style="text-align:center">
          <img src="${i.url}" title="${esc((i.uploadedAt||'').substring(0,19))} by ${esc(i.uploadedBy||'')}" style="width:54px;height:54px;border-radius:50%;object-fit:contain;background:rgba(255,255,255,.05);border:${current&&current.id===i.id?'2px solid var(--gold)':'1px solid var(--line)'}"/>
          <div><button class="ghost" style="padding:4px 10px;font-size:.78rem" onclick="assignImg(${i.id})">${current&&current.id===i.id?'current':'use'}</button></div>
        </div>`).join('')}
      </div>`:''}
    </div>`;
  };
  el.innerHTML=`
    <div class="crumbs"><a onclick="go({name:'fleet'})">← Fleet</a> / Coin Images</div>
    <h2 style="font-size:1.4rem;margin-bottom:6px">Coin Images — per kiosk</h2>
    <p class="muted" style="margin-bottom:16px">Each kiosk has its own Coin 1 and Coin 2. Pick a kiosk, choose any picture of the coin, and press <b>Upload &amp; apply</b> — it publishes to that kiosk only and the kiosk picks it up on its next sync. Revert by clicking an older version.</p>
    <p class="muted" style="margin-bottom:16px;font-size:.82rem">The image is prepared automatically: the plain background is trimmed off, the coin is centred, cut to a circle and made transparent. The kiosk then displays it with the standard coin treatment — a full 3D spin every 8s with the reeded edge and matching shadow. The round preview below is exactly what the kiosk will show. <b>Tip:</b> a face-on picture on a plain background works best. Leave a coin unset to use the bundled default artwork.</p>
    <div class="row" style="margin-bottom:18px">
      <label class="muted">Kiosk</label>
      <select onchange="_imgKiosk=this.value;_preview={1:null,2:null};render()">
        ${kiosks.map(x=>`<option value="${x.id}" ${x.id===_imgKiosk?'selected':''}>${esc(x.name)}</option>`).join('')}
      </select>
      ${k?`<span class="muted">${esc(k.location||k.destination)}</span>`:''}
      ${k?(k.synced?'<span class="pill on">✓ Synced</span>':'<span class="pill" style="background:rgba(224,160,32,.15);color:var(--amber)">● Pending sync</span>'):''}
    </div>
    ${k?slotBlock(1)+slotBlock(2):'<div class="empty">No kiosks yet. Add one from the Fleet view.</div>'}
    <div class="card">
      <div class="label">Coins across the fleet</div>
      <table><thead><tr><th>Kiosk</th><th>Coin 1</th><th>Coin 2</th><th>Sync</th></tr></thead><tbody>
      ${kiosks.map(x=>`<tr style="cursor:pointer" onclick="_imgKiosk='${x.id}';render()"><td>${esc(x.name)}</td>

/* Turn ANY uploaded picture into a kiosk-ready coin face: trim the plain
   background, centre it, cut it to a circle and make the outside transparent.
   That way an operator just picks a file — the kiosk then spins it with the
   standard 3D coin treatment (rim, thickness, shadow). */
function processCoinImage(dataUrl){
  return new Promise((resolve,reject)=>{
    const img=new Image();
    img.onerror=()=>reject(new Error('bad image'));
    img.onload=()=>{
      const W=img.naturalWidth,H=img.naturalHeight;
      const c=document.createElement('canvas'); c.width=W; c.height=H;
      const x=c.getContext('2d',{willReadFrequently:true}); x.drawImage(img,0,0);
      const d=x.getImageData(0,0,W,H).data;
      const at=(X,Y)=>{const i=(Y*W+X)*4;return [d[i],d[i+1],d[i+2],d[i+3]]};
      const near=(p,q,t)=>Math.abs(p[0]-q[0])<t&&Math.abs(p[1]-q[1])<t&&Math.abs(p[2]-q[2])<t;
      const corners=[at(0,0),at(W-1,0),at(0,H-1),at(W-1,H-1)];
      const bg=corners[0];
      const plain=corners.every(cc=>near(cc,bg,26));
      let x0=0,y0=0,x1=W-1,y1=H-1;
      if(plain){
        const isBg=(X,Y)=>{const p=at(X,Y);return p[3]<12||near(p,bg,30)};
        const rowBg=Y=>{for(let X=0;X<W;X+=2) if(!isBg(X,Y)) return false; return true};
        const colBg=X=>{for(let Y=0;Y<H;Y+=2) if(!isBg(X,Y)) return false; return true};
        while(y0<y1&&rowBg(y0))y0++;  while(y1>y0&&rowBg(y1))y1--;
        while(x0<x1&&colBg(x0))x0++;  while(x1>x0&&colBg(x1))x1--;
      }
      const w=x1-x0+1,h=y1-y0+1,box=Math.max(w,h);
      const S=Math.min(640,Math.max(160,box));
      const out=document.createElement('canvas'); out.width=out.height=S;
      const o=out.getContext('2d');
      o.save(); o.beginPath(); o.arc(S/2,S/2,S/2-1,0,Math.PI*2); o.clip();
      const k=S/box, dw=w*k, dh=h*k;
      o.drawImage(img,x0,y0,w,h,(S-dw)/2,(S-dh)/2,dw,dh);
      o.restore();
      resolve(out.toDataURL('image/png'));
    };
    img.src=dataUrl;
  });
}
function previewImg(slot,input){
  const f=input.files[0]; if(!f)return;
  const reader=new FileReader();
  reader.onload=async()=>{
    let url=reader.result, mime='image/png';
    try{ url=await processCoinImage(reader.result); }
    catch(e){ mime=f.type; }   // fall back to the raw file if it can't be read
    _preview[slot]={url, mime, name:(f.name||'coin').replace(/\.[^.]+$/,'')+'.png'};
    render();
  };
  reader.readAsDataURL(f);
}

function metric(label,val,cls){return `<div class="card"><div class="label">${label}</div><div class="val ${cls||''}">${val}</div></div>`}
function kCard(k){

async function addKiosk(){
  const dests=await api('/api/destinations');
  const id=prompt('Kiosk ID (e.g. kiosk-006):'); if(!id)return;
  const name=prompt('Kiosk name:'); if(!name)return;
  const location=prompt('Location:')||'';
  const destinationId=prompt('Destination id ('+dests.map(d=>d.id).join(', ')+'):',dests[0]?.id)||dests[0]?.id;
  const r=await api('/api/kiosks',{method:'POST',body:JSON.stringify({id,name,location,destinationId})});
  if(r.apiKey) alert('Kiosk created.\\n\\nAPI key (enter this on the kiosk):\\n'+r.apiKey);
  render();
}

      <div class="card"><div class="muted" style="margin-bottom:8px">${rec.from.substring(0,10)} → ${rec.to.substring(0,10)}</div>

      ${rec.coins.map(c2=>`<tr><td>Coin ${c2.slot}</td><td>${c2.paid}</td><td>${rand(c2.paidRevenue)}</td><td class="ok">${c2.dispensed}</td><td class="${c2.notDispensed?'err':'dim'}">${c2.notDispensed}</td><td class="${c2.refundOwed?'err':'dim'}">${rand(c2.refundOwed)}</td><td>${c2.refillsAdded}</td></tr>`).join('')}
      </tbody></table>
      <p class="muted" style="font-size:.8rem;margin-top:10px">"Not dispensed" = paid but coin not released (refund owed). "Refund owed" = paid revenue minus dispensed value.</p>
      </div>
      <h3 style="font-size:1.05rem;margin:22px 0 10px">Hopper maintenance (reported by kiosk)</h3>
      <div class="card">
      ${(inv.maintenance&&inv.maintenance.length)?`<table><thead><tr><th>Date/Time</th><th>Hopper</th><th>Action</th><th>Qty</th><th>Stock</th><th>Operator</th><th>Role</th></tr></thead><tbody>
        ${inv.maintenance.map(e=>`<tr><td>${esc((e.createdAt||'').replace('T',' ').substring(0,19))}</td><td>${e.hopperId}</td><td class="${e.type==='refill'?'ok':''}" style="${e.type==='empty'?'color:var(--amber)':''}">${e.type==='refill'?'Refill':'Empty (maint.)'}</td><td>${e.type==='refill'?'+'+e.quantity:e.quantity}</td><td>${e.oldStock} → ${e.newStock}</td><td>${esc(e.operator||'-')}</td><td class="dim">${esc(e.operatorRole||'-')}</td></tr>`).join('')}
      </tbody></table><p class="muted" style="font-size:.8rem;margin-top:10px">Emptying and refilling done on the kiosk. These are maintenance actions, not sales.</p>`
        :'<div class="muted" style="padding:12px 0">No hopper maintenance reported yet.</div>'}
      </div>`;
  }
}
function healthLine(label,ok){return `<div class="row between" style="padding:10px 0;border-bottom:1px solid var(--line)"><span><span style="display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px;background:${ok?'var(--green)':'var(--red)'}"></span>${label}</span><span class="${ok?'ok':'err'}">${ok?'Connected':'Offline'}</span></div>`}
function hopper(label,h){if(!h)return `<div class="row between" style="padding:8px 0"><span>${label}</span><span class="dim">—</span></div>`;const pct=Math.min(100,Math.round((h.coinCount/1000)*100));const col=h.status==='ok'?'':'err';return `<div style="padding:8px 0"><div class="row between"><span>${label} <span class="muted">(${esc(h.status)})</span></span><b class="${col}">${h.coinCount}</b></div><div class="hopbar"><div style="width:${pct}%"></div></div></div>`}
function txTable(rows){
  if(!rows.length)return '<div class="empty">No transactions.</div>';
  return '<table><thead><tr><th>Date/Time</th><th>Transaction ID</th><th>Coin</th><th>Amount</th><th>Payment</th><th>Dispense</th></tr></thead><tbody>'+
    rows.map(t=>`<tr><td class="dim">${esc((t.createdAt||'').substring(0,19))}</td><td class="mono">${esc(t.transactionId)}</td><td>Coin ${t.coinSelected}</td><td>${rand(t.amount)}</td><td class="${t.paymentResult==='approved'?'ok':'err'}">${esc(t.paymentResult)}</td><td class="${t.dispenseResult==='success'?'ok':(t.dispenseResult?'err':'dim')}">${esc(t.dispenseResult||'—')}</td></tr>`).join('')+'</tbody></table>';
}
async function setStatus(id){const v=document.getElementById('opstat').value;await api('/api/kiosks/'+id,{method:'PATCH',body:JSON.stringify({operationalStatus:v})});document.getElementById('opmsg').textContent='Updated';setTimeout(()=>render(),600)}
async function setDest(id){const v=document.getElementById('kdest').value;await api('/api/kiosks/'+id,{method:'PATCH',body:JSON.stringify({destinationId:v})});document.getElementById('kmetamsg').textContent='Destination saved';setTimeout(()=>render(),600)}
async function setTags(id){const v=document.getElementById('ktags').value.split(',').map(s=>s.trim()).filter(Boolean);await api('/api/kiosks/'+id,{method:'PATCH',body:JSON.stringify({tags:v})});document.getElementById('kmetamsg').textContent='Tags saved';setTimeout(()=>render(),600)}
async function schedulePrice(id){
  const p=parseFloat(document.getElementById('schprice').value),w=document.getElementById('schwhen').value;
  if(!isFinite(p)||p<0){document.getElementById('schmsg').textContent='Enter a price';return}
  if(!w){document.getElementById('schmsg').textContent='Pick a date/time';return}
  const r=await api('/api/kiosks/'+id+'/schedule',{method:'POST',body:JSON.stringify({priceCents:Math.round(p*100),applyAt:new Date(w).toISOString()})});
  document.getElementById('schmsg').textContent=r.error||'Scheduled';if(!r.error)setTimeout(()=>render(),700);
}
async function cancelSchedule(sid){await api('/api/schedules/cancel',{method:'POST',body:JSON.stringify({id:sid})});render()}
async function savePromo(id){
  const text=document.getElementById('promoText').value;
  const enabled=document.getElementById('promoOn').checked;
  await api('/api/kiosks/'+id,{method:'PATCH',body:JSON.stringify({promoText:text,promoEnabled:enabled})});
  document.getElementById('promomsg').textContent='Saved — kiosk will apply on next sync';
  setTimeout(()=>render(),800);
}
async function saveQR(id){
  const body=JSON.stringify({
    qrEnabled:document.getElementById('qrOn').checked,
    qrUrl:document.getElementById('qrUrl').value,
    qrCaption:document.getElementById('qrCaption').value
  });
  await api('/api/kiosks/'+id,{method:'PATCH',body});
  document.getElementById('qrmsg').textContent='Saved — kiosk will apply on next sync';
  setTimeout(()=>render(),800);
}
async function saveMarketing(id){
  const body=JSON.stringify({
    kioskId:id,
    enabled:document.getElementById('mk_on').checked,
    slideSeconds:parseInt(document.getElementById('mk_dur').value)||10,
    idleSeconds:parseInt(document.getElementById('mk_idle').value)||60,
    activeStart:document.getElementById('mk_start').value,
    activeEnd:document.getElementById('mk_end').value
  });
  await api('/api/marketing/settings',{method:'POST',body});
  document.getElementById('mk_msg').textContent='Saved';
  setTimeout(()=>render(),700);
}
async function uploadMarketing(id){
  const f=document.getElementById('mk_file').files[0];
  if(!f){document.getElementById('mk_umsg').textContent='Choose a file';return}
  const reader=new FileReader();
  reader.onload=async()=>{
    const dataBase64=reader.result.split(',')[1];
    const r=await api('/api/marketing/image',{method:'POST',body:JSON.stringify({kioskId:id,name:f.name,mime:f.type,dataBase64})});
    document.getElementById('mk_umsg').textContent=r.error||'Uploaded';
    setTimeout(()=>render(),700);
  };
  reader.readAsDataURL(f);
}
async function removeMarketing(imageId){
  if(!confirm('Remove this marketing image?'))return;
  await api('/api/marketing/remove',{method:'POST',body:JSON.stringify({imageId})});
  render();
}
async function resolveAlert(tid){await api('/api/alerts/resolve',{method:'POST',body:JSON.stringify({transactionId:tid})});render()}
async function addMaint(id){const n=document.getElementById('mnote').value;if(!n)return;await api('/api/kiosks/'+id+'/maintenance',{method:'POST',body:JSON.stringify({note:n})});render()}
function copyKey(){const t=document.getElementById('apikey').textContent;navigator.clipboard.writeText(t).then(()=>{document.getElementById('keymsg').textContent='Copied';setTimeout(()=>document.getElementById('keymsg').textContent='',1500)})}
async function regenKey(id){
  if(!confirm('Regenerate the API key? The kiosk will stop syncing until you enter the new key on the machine.'))return;
  const r=await api('/api/kiosks/'+id+'/regenerate',{method:'POST'});
  if(r.apiKey){document.getElementById('apikey').textContent=r.apiKey;document.getElementById('keymsg').textContent='New key generated';}
}
async function setAdminPin(id){
  const v=(document.getElementById('apin').value||'').trim();
  if(!/^\d{4,8}$/.test(v)){document.getElementById('apinmsg').textContent='Enter 4–8 digits';return}
  await api('/api/kiosks/'+id,{method:'PATCH',body:JSON.stringify({adminPin:v})});
  document.getElementById('apinmsg').textContent='Pushed — applies on next sync';setTimeout(()=>render(),900)
}
async function clearAdminPin(id){
  if(!confirm('Clear the PIN override? The kiosk keeps whatever PIN it currently has set locally.'))return;
  await api('/api/kiosks/'+id,{method:'PATCH',body:JSON.stringify({adminPin:''})});
  setTimeout(()=>render(),700)
}
async function toggleCoin(id,slot,enabled){
  if(enabled && !confirm('Disable Coin '+slot+'? It will be hidden on the kiosk on the next sync.'))return;
  await api('/api/kiosks/'+id,{method:'PATCH',body:JSON.stringify({['coin'+slot+'Enabled']:!enabled})});
  setTimeout(()=>render(),500)
}
async function deleteKiosk(id,name){
  if(!confirm('Delete kiosk "'+name+'"?\\n\\nThis removes its profile, transactions, alerts, images and history. This cannot be undone.'))return;
  const r=await api('/api/kiosks/'+id,{method:'DELETE'});
  if(r.ok){go({name:'fleet'})}else{alert(r.error||'Delete failed')}
}

/* ---------- GLOBAL REPORTS ---------- */
function gRange(){return (window._gfrom&&window._gto)?{from:window._gfrom,to:window._gto}:null}
function gQS(){const r=gRange();return r?('from='+r.from+'&to='+r.to):('period='+(window._gp||'all'))}
function gTsQS(){const r=gRange();return r?('from='+r.from+'&to='+r.to):'days=30'}
function applyGlobalRange(){
  const f=document.getElementById('gfrom').value,t=document.getElementById('gto').value;
  if(!f||!t){alert('Pick both a start and end date.');return}
  if(f>t){alert('Start date must be on or before end date.');return}
  window._gfrom=f;window._gto=t;render();
}
function clearGlobalRange(){window._gfrom=null;window._gto=null;render()}
async function renderGlobal(el){
  window._gp=window._gp||'all';
  const r=gRange();
  const [g,ts]=await Promise.all([api('/api/reports/global?'+gQS()),api('/api/reports/timeseries?'+gTsQS())]);
  const periods=['today','week','month','all'];
  const locRows=Object.entries(g.byLocation).sort((a,b)=>b[1].revenue-a[1].revenue);
  const chartTitle=r?('Daily revenue — '+r.from+' to '+r.to):'Daily revenue — last 30 days (fleet)';
  el.innerHTML=`
    <div class="crumbs"><a onclick="go({name:'fleet'})">← Fleet</a> / Global Reports</div>
    <div class="row between">
      <h2 style="font-size:1.4rem">Global Reporting — All Kiosks</h2>
      <div class="row"><button class="ghost" onclick="exportGlobalExcel()">Export Excel</button><button class="ghost" onclick="exportGlobalPDF()">Export PDF</button></div>
    </div>
    <div class="pills" style="margin-top:14px">${periods.map(p=>`<button class="pchip ${!r&&p===window._gp?'active':''}" onclick="window._gfrom=null;window._gto=null;window._gp='${p}';render()">${p==='all'?'All Time':p[0].toUpperCase()+p.slice(1)}</button>`).join('')}</div>
    <div class="row" style="margin:0 0 18px;gap:8px;align-items:center;flex-wrap:wrap">
      <span class="muted">Custom range:</span>
      <input type="date" id="gfrom" value="${window._gfrom||''}"/>
      <span class="muted">to</span>
      <input type="date" id="gto" value="${window._gto||''}"/>
      <button class="ghost" onclick="applyGlobalRange()">Apply</button>
      ${r?`<button class="ghost" onclick="clearGlobalRange()">Clear</button><span class="pill on">${r.from} → ${r.to}</span>`:''}
    </div>
    <div class="grid metrics" style="margin-bottom:22px">
      ${metric('Total Sales',g.totalSales)}
      ${metric('Total Revenue',rand(g.totalRevenue))}
      ${metric('All Transactions',g.totalTransactions)}
      ${metric('Coins in Hoppers',g.coinsInHoppers)}
      ${metric('Kiosks Online',g.kiosksOnline+' / '+g.kiosksTotal)}
      ${metric('Open Alerts',g.openAlerts,g.openAlerts?'err':'')}
    </div>
    <div class="card" style="margin-bottom:18px"><div class="label">${chartTitle}</div><div style="position:relative;height:240px;margin-top:8px"><canvas id="rchart"></canvas></div></div>
    <div class="card">
      <div class="label">Revenue by Location</div>
      <table><thead><tr><th>Location</th><th>Sales</th><th>Revenue</th></tr></thead><tbody>
      ${locRows.map(([loc,v])=>`<tr><td>${esc(loc)}</td><td>${v.sales}</td><td>${rand(v.revenue)}</td></tr>`).join('')||'<tr><td colspan=3 class="empty">No data</td></tr>'}
      </tbody></table>
    </div>`;
  drawRevenueChart('rchart',ts);
}

/* ---------- Charts + Excel/PDF export ---------- */
let _chart=null;
const dt=s=>(s||'').replace('T',' ').substring(0,19);
function drawRevenueChart(canvasId,series){
  const cv=document.getElementById(canvasId);
  if(!cv||!window.Chart)return;
  if(_chart){try{_chart.destroy()}catch(e){}_chart=null}
  _chart=new Chart(cv,{type:'bar',data:{labels:series.map(p=>p.date.substring(5)),datasets:[{label:'Revenue (R)',data:series.map(p=>Math.round(p.revenue/100)),backgroundColor:'#c9a227',borderRadius:3}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{ticks:{color:'#9fb0c8',maxTicksLimit:12,font:{size:10}},grid:{display:false}},y:{ticks:{color:'#9fb0c8'},grid:{color:'rgba(255,255,255,.06)'}}}}});
}
function libOK(g){if(!window[g]&&!(g==='jspdf'&&window.jspdf)){alert('Export needs internet (report library failed to load).');return false}return true}
function kRange(){return (window._kfrom&&window._kto)?{from:window._kfrom,to:window._kto}:null}
function kQS(){const r=kRange();return r?('from='+r.from+'&to='+r.to):('period='+(window._kp||'today'))}
function kTsQS(){const r=kRange();return r?('from='+r.from+'&to='+r.to):'days=30'}
function kTxQS(){const r=kRange();return r?('?from='+r.from+'&to='+r.to):''}
function applyKioskRange(){
  const f=document.getElementById('kfrom').value,t=document.getElementById('kto').value;
  if(!f||!t){alert('Pick both a start and end date.');return}
  if(f>t){alert('Start date must be on or before end date.');return}
  window._kfrom=f;window._kto=t;render();
}
function clearKioskRange(){window._kfrom=null;window._kto=null;render()}
async function exportKioskExcel(id){
  if(!libOK('XLSX'))return;
  const [k,tx]=await Promise.all([api('/api/kiosks/'+id),api('/api/kiosks/'+id+'/transactions'+kTxQS())]);
  const rows=tx.map(t=>({Date:dt(t.createdAt),'Transaction ID':t.transactionId,Coin:t.coinSelected,'Amount (R)':t.amount/100,Payment:t.paymentResult,Dispense:t.dispenseResult||''}));
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(rows.length?rows:[{Date:'',['Transaction ID']:'No transactions'}]),'Transactions');
  XLSX.writeFile(wb,(k.name||id).replace(/\W+/g,'_')+'_transactions.xlsx');
}
async function exportKioskPDF(id){
  if(!libOK('jspdf'))return;
  const r=kRange();
  const [k,tx]=await Promise.all([api('/api/kiosks/'+id),api('/api/kiosks/'+id+'/transactions'+kTxQS())]);
  const {jsPDF}=window.jspdf;const doc=new jsPDF();
  doc.setFontSize(14);doc.text('Transactions — '+(k.name||id),14,16);
  doc.setFontSize(10);doc.text((r?('Range: '+r.from+' to '+r.to+'   ·   '):'')+'Generated '+new Date().toLocaleString(),14,22);
  doc.autoTable({startY:28,styles:{fontSize:8},headStyles:{fillColor:[201,162,39]},head:[['Date','Transaction','Coin','Amount','Payment','Dispense']],body:tx.map(t=>[dt(t.createdAt),t.transactionId,'Coin '+t.coinSelected,'R'+(t.amount/100).toFixed(2),t.paymentResult,t.dispenseResult||'—'])});
  doc.save((k.name||id).replace(/\W+/g,'_')+'_transactions.pdf');
}
async function exportKioskSalesExcel(id){
  if(!libOK('XLSX'))return;
  const r=kRange();const label=r?(r.from+' to '+r.to):(window._kp||'today');
  const [k,s,ts]=await Promise.all([api('/api/kiosks/'+id),api('/api/kiosks/'+id+'/sales?'+kQS()),api('/api/kiosks/'+id+'/timeseries?'+kTsQS())]);
  const wb=XLSX.utils.book_new();
  const summary=[{Metric:'Kiosk',Value:k.name},{Metric:'Period',Value:label},{Metric:'Total Sales',Value:s.totalSales},{Metric:'Total Revenue (R)',Value:s.totalRevenue/100},{Metric:'Coin 1 Sales',Value:s.coin1Sales},{Metric:'Coin 1 Revenue (R)',Value:s.coin1Revenue/100},{Metric:'Coin 2 Sales',Value:s.coin2Sales},{Metric:'Coin 2 Revenue (R)',Value:s.coin2Revenue/100}];
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(summary),'Sales Summary');
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(ts.map(p=>({Date:p.date,Sales:p.sales,'Revenue (R)':p.revenue/100}))),'Daily');
  XLSX.writeFile(wb,(k.name||id).replace(/\W+/g,'_')+'_sales_'+label.replace(/\W+/g,'_')+'.xlsx');
}
async function exportKioskSalesPDF(id){
  if(!libOK('jspdf'))return;
  const r=kRange();const label=r?(r.from+' to '+r.to):(window._kp||'today');
  const [k,s]=await Promise.all([api('/api/kiosks/'+id),api('/api/kiosks/'+id+'/sales?'+kQS())]);
  const {jsPDF}=window.jspdf;const doc=new jsPDF();
  doc.setFontSize(14);doc.text('Sales — '+(k.name||id),14,16);
  doc.setFontSize(10);doc.text('Period: '+label+'   ·   Generated '+new Date().toLocaleString(),14,22);
  doc.autoTable({startY:28,theme:'plain',body:[['Total sales',s.totalSales],['Total revenue','R'+(s.totalRevenue/100).toFixed(2)],['Coin 1 sales',s.coin1Sales],['Coin 1 revenue','R'+(s.coin1Revenue/100).toFixed(2)],['Coin 2 sales',s.coin2Sales],['Coin 2 revenue','R'+(s.coin2Revenue/100).toFixed(2)]]});
  doc.save((k.name||id).replace(/\W+/g,'_')+'_sales_'+label.replace(/\W+/g,'_')+'.pdf');
}
async function exportGlobalExcel(){
  if(!libOK('XLSX'))return;
  const r=gRange();const label=r?(r.from+' to '+r.to):(window._gp||'all');
  const g=await api('/api/reports/global?'+gQS());
  const ts=await api('/api/reports/timeseries?'+gTsQS());
  const wb=XLSX.utils.book_new();
  const summary=[{Metric:'Period',Value:label},{Metric:'Total Sales',Value:g.totalSales},{Metric:'Total Revenue (R)',Value:g.totalRevenue/100},{Metric:'All Transactions',Value:g.totalTransactions},{Metric:'Coins in Hoppers',Value:g.coinsInHoppers},{Metric:'Kiosks Online',Value:g.kiosksOnline+'/'+g.kiosksTotal},{Metric:'Open Alerts',Value:g.openAlerts}];
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(summary),'Summary');
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(Object.entries(g.byLocation).map(([Location,v])=>({Location,Sales:v.sales,'Revenue (R)':v.revenue/100}))),'By Location');
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(g.perKiosk.map(k=>({Kiosk:k.name,Location:k.location,Online:k.online?'yes':'no',Sales:k.sales,'Revenue (R)':k.revenue/100,'Coin 1':k.coin1Sales,'Coin 2':k.coin2Sales}))),'Per Kiosk');
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(ts.map(p=>({Date:p.date,Sales:p.sales,'Revenue (R)':p.revenue/100}))),'Daily');
  XLSX.writeFile(wb,'fleet_report_'+label.replace(/\W+/g,'_')+'.xlsx');
}
async function exportGlobalPDF(){
  if(!libOK('jspdf'))return;
  const r=gRange();const label=r?(r.from+' to '+r.to):(window._gp||'all');
  const g=await api('/api/reports/global?'+gQS());
  const {jsPDF}=window.jspdf;const doc=new jsPDF();
  doc.setFontSize(15);doc.text('Souvenir Coin Kiosk — Fleet Report',14,16);
  doc.setFontSize(10);doc.text('Period: '+label+'   ·   Generated '+new Date().toLocaleString(),14,23);
  doc.autoTable({startY:30,theme:'plain',body:[['Total sales',g.totalSales],['Total revenue','R'+(g.totalRevenue/100).toFixed(2)],['All transactions',g.totalTransactions],['Coins in hoppers',g.coinsInHoppers],['Kiosks online',g.kiosksOnline+' / '+g.kiosksTotal],['Open alerts',g.openAlerts]]});
  doc.autoTable({startY:doc.lastAutoTable.finalY+8,headStyles:{fillColor:[201,162,39]},head:[['Kiosk','Location','Online','Sales','Revenue']],body:g.perKiosk.map(k=>[k.name,k.location||'',k.online?'yes':'no',k.sales,'R'+(k.revenue/100).toFixed(2)])});
  doc.save('fleet_report_'+label.replace(/\W+/g,'_')+'.pdf');
}
</script>
