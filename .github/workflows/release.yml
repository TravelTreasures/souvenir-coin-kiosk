name: Build & publish kiosk (OTA feed)

# Triggers:
#   • push a tag like v1.20.0  → builds the Linux AppImages (x86-64 AND arm64)
#     and publishes them + the per-arch update feeds to a single GitHub Release.
#   • manual run (workflow_dispatch) for testing.
#
# Mixed fleet: x86 mini-PCs install Souvenir-Coin-Kiosk-x64.AppImage and read
# stable-linux.yml; Raspberry Pi 5 (arm64) installs Souvenir-Coin-Kiosk-arm64.AppImage
# and reads stable-linux-arm64.yml. electron-updater on each kiosk automatically
# requests only its own architecture's feed, so one "Deploy 1.21.x" updates both.
#
# No secrets to configure: GITHUB_TOKEN is provided automatically; the
# permissions block below lets it create the release.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build ${{ matrix.arch }}
    strategy:
      # Build both arches even if one fails, so a problem on one doesn't block the other.
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest,    arch: x64 }    # x86-64 mini-PCs
          - { runner: ubuntu-24.04-arm, arch: arm64 }  # Raspberry Pi 5
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # serialport / better-sqlite3 are native modules; libudev-dev is needed to
      # build serialport on Linux. build-essential + python3 ship on the runner.
      # On the arm64 runner this installs the arm64 libs, so the native modules
      # are compiled natively for aarch64 (no cross-compilation / QEMU needed).
      # NOTE: this step must never fail the build on its own. GitHub's Ubuntu
      # package mirrors are sometimes unreachable, which made "apt-get" exit with
      # code 100 and failed BOTH builds before any of our code was compiled.
      # Now: skip if the library is already there, use short timeouts, and carry
      # on with a warning if the mirror is down (serialport and better-sqlite3
      # normally use their prebuilt binaries, so the build can still succeed).
      - name: Install native build deps
        run: |
          if dpkg -s libudev-dev >/dev/null 2>&1; then
            echo "libudev-dev already installed - skipping apt"
            exit 0
          fi
          APT_OPTS="-o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20"
          sudo apt-get $APT_OPTS update || echo "::warning::apt-get update failed (package mirror problem) - trying install anyway"
          sudo apt-get $APT_OPTS install -y libudev-dev || echo "::warning::could not install libudev-dev - continuing without it"

      - name: Install dependencies
        run: npm install

      - name: Build renderer/main
        run: npm run build

      - name: Package & publish AppImage (${{ matrix.arch }}) + update feed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx --no-install electron-builder --linux AppImage --${{ matrix.arch }} --publish always
